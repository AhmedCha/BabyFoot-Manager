<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyFoot Manager</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
  <div>
    <h1>BabyFoot Manager</h1>
    <div id="main-container">

      <!-- Games Section -->
      <div id="games-section">
        <div id="input-container">
          <form method="get" id="game-form">
            <input type="text" id="player1" placeholder="Joueur 1" class="player-name" />
            <label id="vs-text">VS</label>
            <input type="text" id="player2" placeholder="Joueur 2" class="player-name" />
            <button type="sybmit" id="add-game-btn">Ajouter</button>
          </form>
        </div>

        <div id="games-container">
          <h2 id="parties">Les Parties<br /></h2>
          <P id="unfinished-counter">Counter</P>
        </div>

        <div id="games-list-container">
          <ul id="games-list">
            <!-- Games will be dynamically added here -->
          </ul>
        </div>
      </div>

      <!-- Resizable Slider -->
      <div id="slider"></div>

      <!-- Chat Section -->
      <div id="chat-section">
        <h2 id="tchat-text">Tchat</h2>

        <!-- Chat Header -->
        <div id="chat-header">
          <form method="get" id="name-form">
            <input type="text" id="user-name" placeholder="Entrer votre nom" />
            <button type="submit" id="set-name-btn">Set Name</button>
          </form>
        </div>

        <!-- Chat History -->
        <div id="chat-history">
          <!-- Chat messages will be dynamically added here -->
        </div>

        <!-- Chat Input -->
        <div id="chat-input">
          <form method="get" id="chat-form">
            <input type="text" id="chat-message" placeholder="Écrire un message" />
            <button type="submit" id="button-chat">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="./script/script.js"></script>
</body>

</html>
